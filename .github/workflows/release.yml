name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=windows GOARCH=amd64 go build \
            -o dist/cronx-windows-amd64.exe ./cmd/cronx

          GOOS=linux GOARCH=amd64 go build \
            -o dist/cronx-linux-amd64 ./cmd/cronx

          GOOS=darwin GOARCH=amd64 go build \
            -o dist/cronx-macos-amd64 ./cmd/cronx

          GOOS=darwin GOARCH=arm64 go build \
            -o dist/cronx-macos-arm64 ./cmd/cronx

      - name: Package binaries
        run: |
          cd dist

          zip cronx-windows-amd64.zip cronx-windows-amd64.exe

          tar -czf cronx-linux-amd64.tar.gz cronx-linux-amd64
          tar -czf cronx-macos-amd64.tar.gz cronx-macos-amd64
          tar -czf cronx-macos-arm64.tar.gz cronx-macos-arm64

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz \
            --clobber
