# The descriptors cronx accepts, one job each, next to the five-field expression
# every one of them stands for. A descriptor is a shorthand for a fixed time,
# and cronx list prints it as it was written here.
#
#   cronx validate --config examples/configs/descriptors.toml
#   cronx list     --config examples/configs/descriptors.toml
#
# As in full.toml, the commands are placeholders: cronx only ever runs an
# absolute path.

[jobs.yearly]
schedule = "@yearly"               # 0 0 1 1 *: midnight on 1 January
command = "/usr/local/bin/report"

[jobs.monthly]
schedule = "@monthly"              # 0 0 1 * *: midnight on the first of the month
command = "/usr/local/bin/invoice"

[jobs.weekly]
schedule = "@weekly"               # 0 0 * * 0: midnight on Sunday
command = "/usr/local/bin/digest"

[jobs.daily]
schedule = "@daily"                # 0 0 * * *: midnight every day
command = "/usr/local/bin/backup"

[jobs.midnight]
schedule = "@midnight"             # 0 0 * * *: the same as @daily
command = "/usr/local/bin/rotate"

[jobs.hourly]
schedule = "@hourly"               # 0 * * * *: the start of every hour
command = "/usr/local/bin/poll"

# @reboot does not stand for a time: the job is run once, when the scheduler
# starts, so cronx list shows "at startup" in its NEXT column.
[jobs.reboot]
schedule = "@reboot"               # once, when the scheduler starts
command = "/usr/local/bin/cache-warmer"
