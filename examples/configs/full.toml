# Every field of a job, plus the global scheduler and logging settings, used at
# least once. It is a reference for the syntax, not a working set-up: replace
# the absolute paths of the commands with programs that exist on your machine.
#
# The optional [logging] path and [storage] path, which move the run log and the
# status database, are left out: this file is validated and listed by the test
# suite exactly as it is, and those paths would point outside the home
# directory. See docs/configuration.md for how to set them.
#
#   cronx validate --config examples/configs/full.toml
#   cronx list     --config examples/configs/full.toml

[scheduler]
timezone = "Europe/Rome"            # an IANA name, or "Local" for the machine zone
max_parallel_jobs = 2               # at most two jobs running at the same time

[logging]
level = "debug"                     # debug | info | warn | error

# A long job that must not overlap with itself: a trigger arriving while the
# previous run is still going is recorded as skipped. It is retried twice
# before giving up, and it is stopped if it exceeds its timeout.
[jobs.backup]
schedule = "0 3 * * *"              # every day at 03:00
command = "/usr/local/bin/backup"
args = ["--incremental", "--destination", "/srv/backup"]
timeout = "2h"
retry = 2
overlap = "skip"
working_directory = "/srv/backup"
env = { BACKUP_TIER = "gold" }

# A frequent job whose runs are cheap and independent: every trigger runs, even
# while a previous run is still going.
[jobs.metrics]
schedule = "*/5 * * * *"
command = "/usr/local/bin/collect-metrics"
timeout = "1m"
overlap = "allow"

# A job that must run once per trigger and in order: a trigger arriving while a
# previous run is still going waits for it instead of being skipped.
[jobs.reindex]
schedule = "30 2 * * 6"             # Saturdays at 02:30
command = "/usr/local/bin/reindex"
args = ["--full"]
overlap = "queue"
env = { REINDEX_SHARDS = "4", REINDEX_BATCH = "500" }

# A valid expression that can never match, because 31 April does not exist.
# `cronx list` shows a dash in the NEXT column and the job never runs.
[jobs.leap-check]
schedule = "0 0 31 4 *"
command = "/usr/local/bin/leap-check"
