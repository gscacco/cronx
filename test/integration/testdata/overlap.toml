# Configuration for a job that takes longer than the minute between two
# activations, so that the second activation arrives while the first run is
# still in progress.
#
# Nothing sets max_parallel_jobs, because the parallel limit is what used to
# hide the overlap policy: with a single slot a trigger that arrived while the
# job was running waited for the slot and then ran the job, instead of being
# skipped as `overlap = "skip"` promises. The policy is applied to a trigger
# when it arrives, so the default single slot skips it as documented.
#
# The job appends a line when it starts, which is how a test can tell how many
# executions really happened: a duplicated run would leave two lines behind. It
# reports its identifier so that the test can check that stopping the scheduler
# stopped it.

[jobs.tick]
schedule = "* * * * *"
command = "@JOB_HELPER@"
args = ["report", "@TEST_DIR@/tick.json", "append", "@TEST_DIR@/ticks", "started\n", "sleep", "240s"]
overlap = "skip"
